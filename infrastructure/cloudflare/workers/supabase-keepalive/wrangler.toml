# Capability probes run directly on Cron, never by polling these cached endpoints.
# Provider credentials are Wrangler secrets, provisioned by configure-service-monitoring.mjs.

# Set SUPABASE_SECRET_KEY with `wrangler secret put` before deployment.

# Scheduled Cron Trigger: Fires every 10 minutes to prevent Supabase 7-day inactivity pause
# and record live latency telemetry for the VaahanSafe Status Page.
[triggers]
crons = ["*/10 * * * *"]
